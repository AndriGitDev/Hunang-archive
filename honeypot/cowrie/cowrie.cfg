# Hunang — Cowrie configuration
#
# Cowrie is a medium-interaction honeypot: it emulates an SSH/Telnet
# server and a fake shell. Attackers interact with a recording, never a
# real system. This config tunes it for clean JSON telemetry and leaves
# the security-relevant defaults (no real command execution, no outbound
# fetch of payloads) untouched.
#
# Full reference: https://docs.cowrie.org/

[honeypot]
hostname = srv-01
# Identify as a plausible small Linux box. Do NOT put anything real here.
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
# Keep emulated filesystem and "downloaded" files contained; Cowrie does
# not execute them.
contents_path = honeyfs
txtcmds_path = txtcmds

# Attackers get a fake shell. Auth is permissive on purpose so we can
# observe post-login behavior — but it is still an emulation.
auth_class = AuthRandom
# AuthRandom: accept after a random number of tries, so most credential
# spraying is recorded as failures with the occasional "success" that
# lets us capture the post-exploitation command sequence.
auth_class_parameters = 2, 5, 10

# Do NOT have Cowrie fetch its OWN public IP from an external service on
# startup: that outbound call is blocked by the egress lockdown and is
# unnecessary here. (This setting is about Cowrie's own address, not the
# attacker's — the attacker's source IP is always logged, then anonymized
# at ingest.)
report_public_ip = false

[ssh]
enabled = true
# Listen on 2222 inside the container; the host/firewall maps 22 -> 2222.
listen_endpoints = tcp:2222:interface=0.0.0.0
# A common OpenSSH banner. Generic on purpose.
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# ── Output plugins ───────────────────────────────────────────────────────
# JSON log is the single source of truth the shipper tails.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false

# Text log for human debugging on the sensor host only (never shipped).
[output_textlog]
enabled = false

# IMPORTANT: do NOT enable any output plugin that makes outbound network
# connections (e.g. external threat-intel uploaders). Egress is locked
# down at the firewall; the only permitted outbound path is the shipper
# to the ingest API. See infra/nftables.conf.
