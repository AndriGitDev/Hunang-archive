# Install as /etc/cloud/cloud.cfg.d/99-hunang-ssh-keys.cfg on the sensor.
#
# The 2026-08-06 upgrade of cloud-init (25.2 -> 26.1) re-ran first-boot logic
# on the next reboot and REGENERATED all SSH host keys, which looks exactly
# like a MITM from the admin side. Host keys on this box are canonical;
# cloud-init must never delete or regenerate them again.
ssh_deletekeys: false
ssh_genkeytypes: []
