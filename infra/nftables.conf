#!/usr/sbin/nft -f
#
# Hunang sensor host firewall — egress lockdown as code.
#
# This is the single most important control in the whole system. A
# honeypot is an attacker-controlled box by design; the one unacceptable
# outcome is it being used to attack someone else. These rules make the
# sensor a dead end: it can be "popped" all day and still cannot reach
# anything but the telemetry endpoint and the few services it needs to
# stay alive.
#
# Apply BEFORE starting Cowrie:
#     sudo nft -f infra/nftables.conf
#     sudo systemctl enable nftables   # persist across reboot
#
# Replace the placeholders marked << >> before applying.

flush ruleset

# The ingest tier has a stable public IPv4 address and is reached over HTTPS,
# so telemetry egress is scoped to one host and one port. A fully compromised
# sensor could reach other HTTPS virtual hosts on this same address, but it
# still cannot scan, spam, SSH anywhere, tunnel over DNS, or reach the wider
# internet. This residual is documented in docs/SECURITY.md.
#
# Verify the hostname still resolves to exactly this address before trusting it:
#     dig +short your-ingest-host.example
# If the address changes, the sensor fails CLOSED — telemetry stops and the
# shipper logs connection errors, which is the safe direction to fail.
define INGEST_HOST   = << INGEST_IPV4/32 >> # replace with your fixed ingest HTTPS origin
define INGEST_TLS_PORT = 443
define DNS_RESOLVER  = << { 185.12.64.1, 185.12.64.2 } >> # the ONLY resolver(s) the sensor may use — keep identical to the cloud-firewall DNS rules (infra/cloud-egress.md)
# The ONLY time server(s) the sensor may use. Do not leave this at the DNS
# resolver's address by mistake: event timestamps are load-bearing here (the
# schema rejects implausible ones, and the "first attack after going live"
# stat is a time difference), so a sensor whose clock is quietly drifting
# because NTP is being dropped is a real failure, not a cosmetic one. Set it
# to whatever your host actually syncs against — check with
# `timedatectl show -p NTP` and resolve that name — not to a guess.
define NTP_SERVER    = << { 213.239.239.164, 213.239.239.165, 213.239.239.166 } >>  # ntp.hetzner.com
define SSH_ADMIN_CIDR = << 198.51.100.0/24 >>  # YOUR admin network for real SSH (port 22022)
define ADMIN_SSH_PORT = 22022             # real management SSH — never 22

table inet filter {

    # ── inbound ──────────────────────────────────────────────────────────
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif "lo" accept

        # The honeypot itself: let the whole internet in on 22/23. THIS is
        # the bait. Cowrie listens on 2222/2223; redirect happens below.
        tcp dport { 22, 23 } accept

        # Real administrative SSH, locked to your network only.
        ip  saddr $SSH_ADMIN_CIDR tcp dport $ADMIN_SSH_PORT accept
        ip6 saddr ::1 tcp dport $ADMIN_SSH_PORT accept

        # Minimal ICMP for path MTU / diagnostics.
        ip  protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 accept

        # Everything else inbound: dropped (policy).
    }

    # ── outbound: THE LOCKDOWN ───────────────────────────────────────────
    chain output {
        type filter hook output priority filter; policy drop;

        ct state established,related accept
        oif "lo" accept

        # 1) Telemetry — the ONLY application egress allowed, and ONLY to the
        #    ingest host over TLS. Not open to the wider internet.
        ip daddr $INGEST_HOST tcp dport $INGEST_TLS_PORT accept

        # 2) DNS — to your ONE resolver only, not the whole internet. A
        #    wide-open port 53 is a working DNS-tunnelling exfil channel, so
        #    it is deliberately NOT allowed here.
        ip daddr $DNS_RESOLVER udp dport 53 accept
        ip daddr $DNS_RESOLVER tcp dport 53 accept

        # 3) NTP — to your ONE time server only. Keeps event timestamps sane.
        ip daddr $NTP_SERVER udp dport 123 accept

        # Outbound ICMP for diagnostics.
        ip  protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # ── PROVISIONING ONLY — leave commented in steady state ──────────
        # General outbound 80/443 for package updates / image pulls. This is
        # a wide-open pivot/C2/exfil channel and it also lets Cowrie's own
        # wget/curl emulation fetch attacker-specified URLs, so it MUST NOT
        # be enabled once the sensor is live. Uncomment ONLY while building
        # the box, then re-comment and reload before Cowrie starts. Better:
        # pin it to your distro mirror's address instead of 0.0.0.0/0.
        #   tcp dport { 80, 443 } accept

        # IMPORTANT: there is deliberately NO general outbound rule. A
        # payload that tries to phone home, scan, or pivot is dropped here.
        # Log drops so you can see attempted pivots in the dashboard story.
        log prefix "EGRESS-DROP " flags all counter drop
    }

    # ── forwarded traffic: the Docker path ───────────────────────────────
    # When Cowrie and the shipper run in Docker (the supported deployment),
    # their traffic traverses this FORWARD hook, not input/output: inbound
    # bait connections are DNAT'd by Docker's port publishing before filter
    # time (so they arrive here with dport 2222/2223), and everything the
    # containers send outbound is forwarded through the bridge. The same
    # lockdown as the output chain therefore has to be enforced here.
    #
    # NOTE: this file starts with `flush ruleset`, which also wipes the nft
    # rules Docker manages for itself. After `nft -f` this file, restart
    # Docker (`systemctl restart docker`) so it re-creates them.
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept

        # Inbound bait → the Cowrie container. Docker has already rewritten
        # host 22/23 to the container's 2222/2223 at prerouting.
        tcp dport { 2222, 2223 } accept

        # Container egress — mirror of the output-chain lockdown: telemetry
        # to the ingest host only, plus the ONE resolver and time server.
        ip daddr $INGEST_HOST tcp dport $INGEST_TLS_PORT accept
        ip daddr $DNS_RESOLVER udp dport 53 accept
        ip daddr $DNS_RESOLVER tcp dport 53 accept
        ip daddr $NTP_SERVER udp dport 123 accept

        # Anything else a container tries — phoning home, scanning, pivoting,
        # Cowrie's wget/curl emulation fetching attacker URLs — is dropped.
        log prefix "FWD-DROP " flags all counter drop
    }
}

# ── redirect the bait ports to Cowrie (non-Docker deployments only) ──────
# Internet hits 22/23; Cowrie listens on 2222/2223 as an unprivileged
# service. The supported Docker deployment (infra/compose.sensor.yml) maps
# host 22→2222 / 23→2223 via compose port publishing instead, so this table
# stays commented out there — enabling both would stack two NATs at the
# same dstnat priority. Uncomment ONLY if you run Cowrie directly on the
# host without Docker.
#
# table inet nat {
#     chain prerouting {
#         type nat hook prerouting priority dstnat; policy accept;
#         tcp dport 22 redirect to :2222
#         tcp dport 23 redirect to :2223
#     }
# }
